[project]
name = "iwashere"
version = "0.1.0"
description = "Local idea dump with hybrid keyword + semantic search over text and images"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "python-multipart>=0.0.20",
    "sqlite-vec>=0.1.9",
    "blake3>=1.0",
    "pillow>=12.0",
    "numpy>=2.0",
    "watchdog>=6.0",
    "tomlkit>=0.13",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Installed on demand by scripts/probe.py --install <group>
torch = ["torch>=2.14", "safetensors>=0.8", "einops>=0.8"]
onnx = ["onnxruntime-gpu>=1.30", "tokenizers>=0.20",
        # Gemma4ImageProcessorPil only: EmbeddingGemma 2 resizes
        # aspect-preserving to a multiple of patch*pool and emits
        # flattened 16x16 patches plus (row, col) ids. Reimplementing
        # that from processor_config.json is a silent-wrongness risk
        # for no gain. The PIL backend is numpy-only - no torch.
        "transformers>=5.17"]
ocr = ["opencv-python-headless>=4.10", "pyclipper>=1.3", "shapely>=2.0", "pyyaml>=6.0"]
needle = ["cactus-needle>=3.0"]
hf = ["huggingface-hub>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py312"
