# Controlled vocabulary seed (spec 7.5).
#   eye: an Eye tag id (data/models/eye/eye_meta.json, tags.model[].id) that
#        Eye scores directly with a calibrated confidence, or null.
#   Terms with eye: null are scored zero-shot by EmbeddingGemma 2, which is
#   what makes arbitrary user vocabulary work at all.
#   prompt: overrides the default "a photo of {term}" for the zero-shot path.
#
# An alias is only set where Eye's tag means the same thing. Eye's `table`
# is furniture, not a table of data; Eye has no tag for night, indoors or
# interfaces, so those stay zero-shot rather than borrowing a near miss.

# --- screenshots, UI, documents. Eye's `type` head covers the broad kinds
#     (screenshot, receipt, chart_or_slide, whiteboard, map, document);
#     interface detail is zero-shot.
- {term: screenshot, requires_text: true,   eye: screenshot,     kind: artifact, prompt: "a screenshot of a computer screen"}
- {term: dashboard, requires_text: true,    eye: null,           kind: artifact, prompt: "a software dashboard with charts and metrics"}
- {term: wireframe,    eye: null,                                kind: artifact, prompt: "a low fidelity wireframe mockup of an interface"}
- {term: code, requires_text: true,         eye: null,           kind: artifact, prompt: "a screenshot of source code in an editor"}
- {term: terminal, requires_text: true,     eye: null,           kind: artifact, prompt: "a terminal or command line window"}
- {term: spreadsheet, requires_text: true,  eye: null,           kind: artifact, prompt: "a spreadsheet of rows and columns of numbers"}
- {term: invoice, requires_text: true,      eye: receipt,        kind: artifact, prompt: "an invoice or receipt document"}
- {term: slide, requires_text: true,        eye: chart_or_slide, kind: artifact, prompt: "a presentation slide"}
- {term: webpage, requires_text: true,      eye: null,           kind: artifact, prompt: "a web page in a browser"}
- {term: form, requires_text: true,         eye: null,           kind: artifact, prompt: "a form with input fields"}
- {term: document, requires_text: true,     eye: document,       kind: artifact, prompt: "a page of a printed document"}

# --- diagrams, charts, maps
- {term: chart,        eye: chart_or_slide, kind: artifact, prompt: "a chart or graph of data"}
- {term: diagram,      eye: null,           kind: artifact, prompt: "a technical diagram with boxes and arrows"}
- {term: map,          eye: map,            kind: artifact, prompt: "a map"}
- {term: site-plan,    eye: null,           kind: artifact, prompt: "an architectural site plan or floor plan drawing"}
- {term: whiteboard, requires_text: true,   eye: whiteboard, kind: artifact, prompt: "handwriting and sketches on a whiteboard"}
- {term: table, requires_text: true,        eye: null,       kind: artifact, prompt: "a table of rows and columns"}
- {term: handwriting, requires_text: true,  eye: handwriting, kind: artifact, prompt: "handwritten text"}

# --- real-world scenes and objects (Eye's 558 Open Images scenes)
- {term: tree,      aliases: [trees], eye: tree,      kind: object}
- {term: forest,    eye: forest,    kind: scene}
- {term: grass,     eye: grass,     kind: object}
- {term: flower,    aliases: [flowers], eye: flower,  kind: object}
- {term: water,     eye: water,     kind: object}
- {term: ocean,     eye: ocean,     kind: scene}
- {term: beach,     eye: beach,     kind: scene}
- {term: mountain,  aliases: [mountains], eye: mountain, kind: scene}
- {term: sky,       eye: sky,       kind: scene}
- {term: cloud,     aliases: [clouds], eye: cloud,    kind: object}
- {term: night,     eye: null,      kind: scene, prompt: "a photo taken at night"}
- {term: sunset,    eye: sunset,    kind: scene}
- {term: snow,      eye: snow,      kind: scene}
- {term: building,  aliases: [buildings], eye: building, kind: object}
- {term: city,      eye: city,      kind: scene}
- {term: road,      eye: road,      kind: object}
- {term: bridge,    eye: bridge_structure, kind: object}
- {term: window,    eye: window,    kind: object}
- {term: door,      eye: door,      kind: object}
- {term: car,       eye: car,       kind: object}
- {term: train,     eye: train,     kind: object}
- {term: boat,      eye: boat,      kind: object}
- {term: animal,    eye: animal,    kind: object}
- {term: cat,       eye: cat,       kind: object}
- {term: dog,       eye: dog,       kind: object}
- {term: bird,      eye: bird,      kind: object}
- {term: person,    aliases: [people], eye: person, kind: object}
- {term: food,      eye: food,      kind: object}
- {term: book,      eye: book,      kind: object}
- {term: chair,     eye: chair,     kind: object}
- {term: plant,     eye: plant,     kind: object}
- {term: laptop,    eye: laptop,    kind: object}

# --- style / medium
- {term: monochrome,   eye: black_and_white,     kind: style}
- {term: photo,        eye: photo,               kind: style, prompt: "a photograph"}
- {term: illustration, eye: illustration_or_art, kind: style, prompt: "a digital illustration or drawing"}
- {term: sketch,       eye: sketch,              kind: style}
- {term: dark-theme,   eye: null,                kind: style, prompt: "a dark themed user interface"}
- {term: portrait,     eye: null,                kind: style, prompt: "a portrait photo of a person"}
- {term: indoors,      eye: null,                kind: scene, prompt: "a photo taken indoors"}
- {term: outdoors,     eye: null,                kind: scene, prompt: "a photo taken outdoors"}
