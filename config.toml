# ZetaDB configuration
# Values marked [M0] were measured on this machine, not estimated.

[server]
host = "127.0.0.1"
port = 8777

[paths]
data       = "./data"
models     = "./data/models"
blobs      = "./data/blobs"
thumbs     = "./data/thumbs"
db         = "./data/zetadb.db"     # an existing data/iwashere.db is adopted on first start
watch_dirs = ["~/dump"]

[gpu]
# [M0] RTX 4050 Laptop (AD107M), 6141 MiB total.
# Intel UHD iGPU drives the Wayland session, so the dGPU is compute-only:
#   6141 total - 76 idle - 288 driver-reserved = 5777 MiB usable.
# Budget leaves ~375 MiB headroom for allocator fragmentation.
total_mb     = 6141
budget_mb    = 5400
pool_a_ttl_s = 300
pool_b_ttl_s = 120
nvidia_smi_poll_ms = 500

[quant]
# Global policy: quantize aggressively, prefer Unsloth Dynamic (UD) quants.
# Vision projectors (mmproj) stay at F16 or Q8_0 - they are small and
# quantizing them below Q8 measurably degrades image grounding.
prefer        = "unsloth-ud"
decoder       = "Q3_K_XL"
mmproj        = "F16"
mmproj_fallback = "Q8_0"

[models.ppocr_det]
role      = "ocr-detection"
repo      = "PaddlePaddle/PP-OCRv6_medium_det_onnx"
backend   = "onnx"
pool      = "A"

[models.ppocr_rec]
role      = "ocr-recognition"
repo      = "PaddlePaddle/PP-OCRv6_medium_rec_onnx"
backend   = "onnx"
pool      = "A"

[models.eye]
# Desert Ant Labs' Eye (PE-Core S/16-384 encoder + tag heads), used with
# permission. Replaces JoyTag: calibrated per-tag confidence over 16 photo
# types and 558 Open Images scenes, where JoyTag gave an uncalibrated sigmoid
# over a Danbooru schema with no word for "screenshot" or "whiteboard".
# eye.tflite is converted once by scripts/convert_eye.py to eye_photo.onnx
# ([M0] parity vs LiteRT over 24 real images: max |diff| 1.3e-4 on every
# head, embedding cosine 1.000000), and then runs in the engine like any
# other ONNX model.
role      = "vocab-tag-scoring"
repo      = "desert-ant-labs/eye"
# The LiteRT model, its tag calibration, and the licence/notice files that
# must ship with it. The Core ML package (Apple only) is not fetched.
file_glob = ["eye.tflite", "eye_meta.json", "README.md", "THIRD_PARTY_NOTICES.md"]
backend   = "auto"          # TensorRT FP16 -> CUDA -> CPU, via server.engine
pool      = "A"
resolution = 384

[models.eg2]
# EmbeddingGemma 2 (Apache-2.0). One 768-d space for text AND images, which
# is what lets vec_text and vec_jina collapse into a single table and
# retires the spec 9.4 deviation - today an image's caption is embedded a
# second time through Qwen purely to have one space holding both notes and
# images.
#
# Replaced models.jina_clip and models.qwen_embed in schema v3; both are
# gone, along with ~2.3 GB of weights and the llama-server subprocess the
# embedding path used to need. llama_server.py stays - the captioner is
# still a llama.cpp model.
#
# dtype is int8 ("quantized") because it is the smallest and the fastest,
# NOT because fp16 is unsafe. [M0] measured against the unquantised graphs
# on 12 real images - agreement with fp32 on identical input:
#            query   document    image     worst   text    image
#   int8    1.0000     0.9999   0.9954    0.9927  2.91s   0.74s/ea
#   fp16    1.0000     1.0000   0.9999    0.9998  4.29s   0.77s/ea
# Retrieval margin is 0.212 (int8) against 0.216 (fp32): indistinguishable.
#
# Google's card warns that fp16 returns NaN or silently degraded vectors
# because the activation range exceeds fp16's dynamic range. That did NOT
# reproduce here, on CPU or CUDA, with zero non-finite values and 1.0000
# agreement. The reason is that onnx-community's fp16 export is MIXED
# precision, not a naive cast: 320 fp16 weight tensors but 7 left fp32,
# and ReduceSum / Max / Sin / Cos still emit fp32. The warning describes a
# torch_dtype=float16 load, where everything runs fp16. So the TensorRT
# FP16 path is NOT off-limits here after all - it is an open optimisation
# for the vision encoder, not a hazard.
#
# int8 still wins on size (509 MB against 878 MB) and speed, at no
# measurable cost, so it stays.
#
# The audio encoder joined in schema v4, when audio and video became items:
# it embeds 30 s sound windows (an audio file, or a video's soundtrack).
role       = "multimodal-embedding"
repo       = "onnx-community/embeddinggemma-2-ONNX"
backend    = "onnx"
file_glob  = ["onnx/model_quantized.onnx*", "onnx/vision_encoder_quantized.onnx*",
              "onnx/audio_encoder_quantized.onnx*"]
dtype      = "quantized"
pool       = "A"             # vision encoder only
# The backbone is the only half a search query needs, so it stays off the
# GPU and a query never waits for pool A to wake - the same reasoning that
# put jina's text tower and Qwen on the CPU. The soft tokens crossing from
# the vision encoder are ~280x512 floats, ~570 KB, so the split is free.
backbone_device   = "cpu"
# Ingest, under the pool A lease, borrows a CUDA copy (+686 MB, ~6x faster
# for audio/video windows, ~12x for passages); released with the encoders.
ingest_backbone_device = "cuda"
dim               = 768
# Matryoshka truncation: 0 keeps all 768. The published table puts 512d at
# 61.17 MTEB vs 61.36, and 64.32 MIEB vs 64.64 - very nearly free. Not
# enabled yet: changing the model and the dimension in one step would make
# a bad retrieval result impossible to attribute. Revisit once 768d is
# calibrated. Truncating REQUIRES re-normalising; pack() already does.
truncate_dim      = 0
# 70 | 140 | 280 | 560 | 1120 soft tokens per image. This is the VRAM knob,
# not a minor quality dial: patch count scales with the budget and attention
# is quadratic in it. [M0] measured on 8 captioned images, image + caption +
# OCR interleaved:
#   280 (checkpoint default) -> 1554 MB, 0.69 s/image, recall@1 100%, margin 0.309
#   140                      ->  624 MB, 0.51 s/image, recall@1 100%, margin 0.291
# 280 costs 2.5x the VRAM for 0.018 of margin. Pool A has ~1739 MB once the
# captioner holds its 3661 MB of pool B, so at 280 the vision encoder alone
# fills pool A and PP-OCR + Eye have nowhere to live. 140 it is.
# (8 images is a thin sample - re-measure on a real corpus before trusting
# the recall figure. The margin delta is the sturdier of the two numbers.)
image_soft_tokens = 140
# Per video frame; the checkpoint's own video processor uses 140.
video_soft_tokens = 140
max_text_tokens   = 8192
# Which graph each encoder runs. The int8 graphs are dynamically quantised,
# which TensorRT cannot run, so the engine sends them to the CUDA EP. Set
# vision_dtype = "fp16" (and download onnx/vision_encoder_fp16.onnx*) to put
# the vision encoder on TensorRT FP16 - see spec 20.2: unmeasured here yet.
vision_backend = "auto"
audio_backend  = "auto"

[engine]
# One engine runs every model (server.engine): TensorRT FP16 -> CUDA -> CPU
# for ONNX graphs, llama.cpp for the VLM, all under the [gpu] budget.
# TurboOCR: builder level 3 cuts TRT build time 3-5x for a small speed cost.
trt_opt_level = 3

[media]
# Audio and video are searched by MOMENT (spec 20). EG2's audio front end
# truncates at 480 000 samples = 30 s, so longer audio is windowed; video
# is vision-only frames, so its soundtrack is windowed as audio too.
audio_window_s    = 30.0
audio_hop_s       = 25.0
silence_rms       = 0.003      # ~ -50 dBFS; quieter windows are skipped
max_audio_windows = 240        # past ~100 min the hop widens to cover it all
video_window_s    = 10.0
frames_per_window = 5          # one frame every 2 s
frame_max_side    = 512        # frames are downscaled before the processor
max_video_windows = 120        # past 20 min the windows widen to cover it all

[llama]
# Which llama.cpp server binary to spawn for pool B. [M0] This machine has
# a multi-backend install - llama-server-cuda / -vulkan / -cpu in
# ~/.local/bin, each a symlink into its own build tree - and NO plain
# `llama-server` anywhere on PATH. The probe looked only for the plain
# name and reported llama.cpp missing while the captioner was expected to
# run, so this is named rather than guessed.
#
# Unset falls back to llama-server-cuda, then llama-server, then the
# vendored build under tools/. CUDA is preferred on purpose: a CPU server
# would caption successfully at a few tokens per second and never show up
# in the VRAM budget, which is the failure that looks like success.
server_bin = "llama-server-cuda"

[models.vlm_default]
# LFM2.5-VL 3B, already built on this machine. [M7] Measured against
# Qwen3.5-4B over all 29 images in spec 17.9: a statistical TIE on the
# metric that decides this - caption-as-query retrieval margin, t=0.49 over
# 29 paired items, ahead on 15 of them - while holding 668 MB less VRAM
# (3079 against 3747), loading in 2.1 s against 9.6 s and captioning 13%
# faster. It also proposes more vocabulary tags, 10.0 per image against 8.1.
#
# It is weaker at reading an interface INTO a caption (OCR grounding 0.555
# against 0.711), but spec 1.1 gives that job to PP-OCRv6 and 17.10 confirms
# PP-OCR keeps it: 18/19 critical tokens verbatim against the VLM's 15/19.
# The caption describes; the OCR engine transcribes.
#
# local_dir, because these weights live outside data/models and there is
# nothing to download. server_args is not optional: without --jinja
# llama.cpp does not render LFM2.5-VL's chat template.
role         = "captioner"
repo         = "LiquidAI/LFM2.5-VL-3B-GGUF"
backend      = "llama.cpp"
local_dir    = "~/llama.cpp/models/lfm25-vl-3b"
file_glob    = "text-q6.gguf"
mmproj_glob  = "mmproj-q8.gguf"
server_args  = ["--jinja"]
name         = "lfm2.5-vl-3b"
pool         = "B"
ctx          = 16384
cache_type   = "q8_0"
flash_attn   = true
# Not a hybrid reasoner, so enable_thinking must NOT be sent - its template
# does not declare it. Qwen3.5 set this true.
hybrid_reasoner = false
# Liquid's documented llama.cpp sampling: --temp 0.2 --top-k 50
# --repeat-penalty 1.0. [M7b] worth ~15% speed and no accuracy change.
[models.vlm_default.sampling]
top_k          = 50
repeat_penalty = 1.0

# The predecessor, kept because its weights are still in data/models and the
# bake-off is reproducible against it. Set as vlm_default to switch back.
[models.vlm_qwen35]
role         = "captioner"
repo         = "unsloth/Qwen3.5-4B-GGUF"
backend      = "llama.cpp"
file_glob    = "Qwen3.5-4B-UD-Q3_K_XL.gguf"
mmproj_glob  = "mmproj-F16.gguf"
name         = "qwen3.5-4b"
pool         = "B"
ctx          = 16384
cache_type   = "q8_0"
flash_attn   = true
hybrid_reasoner = true
enabled      = false

[models.needle]
role    = "structured-extraction"
repo    = "Cactus-Compute/needle3"
backend = "cactus"
pool    = "CPU"
runtime_fetched = true   # engine + weights land in ~/.cache/cactus-needle

[ocr]
# Per-model backend. Detection builds a clean TensorRT INT8 engine and runs
# ~2x faster there. Recognition does not: excluding its 18710-way classifier
# head from quantisation (required for accuracy, see spec 5.1) fragments the
# graph into many small TRT partitions that take many minutes to build for
# no measured gain - it is already ~9x faster than fp32 on the CUDA EP.
# Both models run on TensorRT at FP16, matching TurboOCR
# (github.com/aiptimizer/TurboOCR), which serves the same PP-OCRv6 models
# in production. FP16 is TensorRT's own execution precision, chosen by the
# builder - the ONNX weights are untouched. That is a different axis from
# weight quantisation, and it is the one that works here: INT8 weights cost
# more than half the recognised text (below), while FP16 keeps accuracy and
# still gives the 3-5x.
det_backend    = "tensorrt"  # auto | tensorrt | onnx-cuda | onnx-cpu
rec_backend    = "tensorrt"
# Recognition is the one model NOT quantised. Measured on the test corpus,
# INT8 PTQ preserved 13/28 text lines even with the 18710-way classifier
# head excluded - "finance@acme.example" became "finiance@acme.examp",
# "2026-03-14" became "202631". The damage is spread through the SVTR
# sequence encoder, not just the output layer. OCR text is what search,
# layout and entity extraction are all built on, so 9 MB is not worth it.
# The INT8 graphs are still built and kept; these switch them on.
# [M7c] spec 17.10: PP-OCR detection drops roughly half the lines of a
# flowing prose paragraph (4-5 of 8, CER 0.908) while reading a
# discrete-field invoice perfectly. When the pixels show far more text lines
# than detection returned, the caption stage re-reads that image with the
# VLM, which measured CER 0.028 on exactly that shape. Gated on page-likeness
# so a photograph's texture cannot trigger it - see ocr_quality.py.
vlm_fallback       = true
fallback_min_lines = 4
fallback_ratio     = 0.6
rec_quantised  = false
det_quantised  = false
backend        = "auto"      # fallback for anything not named above
det_long_edge  = 960
min_rec_score  = 0.5
rec_height     = 48
rec_width_buckets = [64, 128, 256, 512]

[layout]
line_tol_factor       = 0.5
line_tol_min_px       = 5.0
blank_line_factor     = 1.4
anchor_round          = 0.25
anchor_min_count_frac = 0.08
anchor_min_count_abs  = 3
flowing_max_anchors   = 4
flowing_min_width_frac = 0.5
flowing_max_gap_cols  = 3.0
sparse_whitespace_frac = 0.8
deskew_min_deg        = 0.5

[vlm]
# Downscale before captioning. A real library is full of 25-50 MP photos;
# sending one whole tiles into a vast number of vision tokens, and a
# 4000x6000 image killed the llama-server connection outright. Escalated
# items (text-dense screenshots) get more pixels, since reading an
# interface is exactly what needs them.
image_long_edge          = 1024
escalate_image_long_edge = 1536
escalate_min_batch    = 8
escalate_max_wait_s   = 600
escalate_on_box_count = 40
escalate_on_text_len  = 600

[embeddings]
# One space, one width. spec 9.4's qwen_covers_image_text is gone with it:
# it existed only to force notes and images into a comparable space by
# embedding every image's caption a second time. EmbeddingGemma 2 puts them
# in the same space natively, so there is nothing left to work around.
dim = 768

[tagging]
w_eye     = 0.45
w_clip    = 0.30
w_vlm     = 0.25
default_threshold = 0.40
review_floor      = 0.25
threshold_step    = 0.02
clip_calibration_sample = 500
# A tag applies when the image is an OUTLIER for that term. The squash is
# centred here, in sigmas above the term's corpus mean - not on the mean
# itself, which accepted 53 of 54 terms per image on a real corpus.
clip_z_center = 2.0
# Absolute cosine floor, below which no relative score can lift a term.
# [!] [M0] This is the weak point of the EG2 swap, and the number is doing
# much less work than it used to. Term prompt -> visual vector over 10 real
# images, the entire band across six unrelated terms:
#   tree       0.479 .. 0.651        screenshot  0.556 .. 0.607
#   chart      0.533 .. 0.631        whiteboard  0.519 .. 0.580
#   invoice    0.470 .. 0.671        diagram     0.524 .. 0.578
# overall 0.470 .. 0.671, mean 0.556. "invoice" and "tree" score the SAME
# images almost identically: the absolute cosine barely encodes whether the
# concept is present. EG2 is retrieval-trained, not contrastively trained
# like CLIP, and its text-image cosines compress into a narrow high band.
# 0.45 therefore only catches true garbage; the per-term z-score below is
# carrying essentially all of the signal now. Run calibrate_clip() and read
# the review queue before trusting this path - and if it is noisy, cut
# tagging.w_clip rather than fiddling with this floor.
clip_abs_floor = 0.45
# Bottom of the observed term-image cosine band, used only by the
# uncalibrated fallback. Moves with the model, like everything else here.
clip_band_lo   = 0.47
clip_z_slope  = 1.0
suppressed_tags_file = "vocab/suppressed.txt"

[vocab]
merge_auto         = 0.86
merge_review       = 0.72
cluster_distance   = 0.18
cooccurrence_merge = 0.60

[search]
rrf_k            = 60
w_tag            = 1.30
w_lexical        = 1.00
w_text_vec       = 1.00
w_img_vec        = 0.90
# [M0] Re-measured for EmbeddingGemma 2. NONE of the old values carry over:
# the whole cosine scale moved, and every one of them was measured against
# Qwen or jina. Query -> vocab term, with the SearchQuery prefix on both:
#   tree -> tree             1.000   exact
#   trees -> tree            0.890   plural
#   screen capture -> shot   0.924   synonym
#   graph -> chart           0.835   synonym
#   forest -> tree           0.706   synonym
#   whiteboard -> chart      0.689   unrelated (arguably not)
#   invoice -> tree          0.517   unrelated
# 0.70 is the only line that separates these, and it is THIN - a real
# synonym at 0.706 against a non-synonym at 0.689. Watch the `seeds` array
# in search responses; if junk terms appear, raise this before anything else.
tag_seed_min_cos = 0.70
# Vector floors keep KNN from returning the whole corpus as "matches" on a
# small library. [M0] a query scores 0.755-0.789 against the right item and
# 0.416-0.515 against the wrong one, in both kinds, so 0.55 clears the
# wrong-answer band with room on either side. Note how much higher this is
# than the 0.30/0.18 it replaces: EG2 has a high floor, and carrying the old
# numbers over would have left these filtering nothing at all.
min_cos_item     = 0.55
min_cos_visual   = 0.55
# Relative gate, applied AFTER the floors: keep only what is within this
# much of the best hit for THIS query. The floors answer "is anything good
# enough"; this answers "where does the result set fall off", and the two
# are not interchangeable. [M0] on 29 images, candidates admitted:
#                        floor only   relative only   both
#   "sourdough recipe"        0            29          0     <- nothing relevant
#   "mountain landscape"     26             6          6     <- many relevant
# A relative gate alone cannot reject a query with no answer: the tail goes
# flat and everything sits within the margin of the best. 0.08 keeps the
# genuinely-close set on broad queries without touching precise ones
# (caption-as-query recall@1 is 100% with or without it).
rel_margin       = 0.08
# Moments - KNN over audio/video segment vectors (spec 20). NOT measured on
# a real corpus yet: 0.50 sits just under the image floor because cross-
# modal (text -> audio) cosines run lower than text -> image in this space.
# Calibrate with a few known recordings before trusting it.
w_moment         = 1.00
min_cos_moment   = 0.50
# How far below the best cosine of a query a result fades to fully dimmed in
# the UI (search.hybrid.match_strength). [M8] on synthetic media the right
# answer beat the closest wrong one by 0.03-0.15, and a sound query's image
# tail sat ~0.10-0.14 below its answer; 0.15 dims that tail to ~0.1-0.3.
# Not yet tuned on a real library.
dim_range        = 0.15

[graph]
seed_top_k         = 8
# [M0] Measured as an all-pairs distribution over a real 32-item corpus,
# because "is 0.70 close?" is meaningless without knowing what an ORDINARY
# pair scores. In this space the median pair is already 0.765:
#            min    p50    p90    p99    max
#   item    0.541  0.765  0.823  0.867  0.905
#   visual  0.609  0.766  0.824  0.866  0.982
#   >= 0.70 ->  63% of item pairs, 88% of visual pairs
#   >= 0.80 ->  25% / 23%
#   >= 0.85 ->   2% / 3%
# Carrying the old 0.70/0.62 across produced 90 semantic links over 32
# items and made a dashboard screenshot's nearest neighbours a mountain
# range and some abstract art - every pair "related" is the same as none
# of them being related. 0.85 sits at roughly p99: genuinely unusual
# closeness, which is what a dotted edge is supposed to mean.
seed_min_cos_item    = 0.85
seed_min_cos_visual  = 0.85
default_hops       = 2
max_nodes          = 60

[dedupe]
phash_hamming_max = 6
# Not re-measured in the 768-d space. Near-duplicate notes should still sit
# very close to 1.0, but confirm before relying on it to suppress anything.
note_cosine_max   = 0.97
